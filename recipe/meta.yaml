{% set name = "pyqtads" %}
{% set version = "5.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/githubuser0xFFFF/Qt-Advanced-Docking-System/archive/v{{ version }}.tar.gz
  sha256: a3d5c8f9573e67f0d28612926eae7ec926f0db71ce358c06ec65b55c4f907e24

build:
  number: 0
  skip: true  # [py2k]

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - {{ compiler('cxx') }}
    - make
    - jom                            # [win]
  host:
    - pyqt-builder
    - setuptools
    - python
    - pyqt
    - sip
    - qt5-advanced-docking-system
    - qt-main
    - xorg-libxfixes                 # [linux]
    - libgl-devel                    # [linux]
  run:
    - python
    - pyqt

test:
  imports:
    - PyQtAds

about:
  home: https://github.com/githubuser0xFFFF/Qt-Advanced-Docking-System
  license: LGPL-2.0-or-later
  license_family: LGPL
  license_file: LICENSE
  summary: Advanced Docking System for Qt
  description: Advanced Docking System for Qt
  dev_url: https://github.com/githubuser0xFFFF/Qt-Advanced-Docking-System

extra:
  recipe-maintainers:
    - klauer
    - n-elie
