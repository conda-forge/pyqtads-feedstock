{% set name = "pyqtads" %}
{% set version = "5.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/githubuser0xFFFF/Qt-Advanced-Docking-System/archive/{{ version }}.tar.gz
  sha256: 12afa0f1eb32fb123568dc2435e8c12d0e87a49934d8ba4ef746f9de2bfc799c

build:
  number: 0
  skip: true  # [py2k]

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - {{ compiler('cxx') }}
    - make
    - jom                            # [win]
  host:
    - pyqt-builder
    - setuptools
    - python
    - pyqt
    - sip
    - qt5-advanced-docking-system
    - qt-main
    - xorg-libxfixes                 # [linux]
    - libgl-devel                    # [linux]
  run:
    - python
    - pyqt

test:
  imports:
    - PyQtAds

about:
  home: https://github.com/githubuser0xFFFF/Qt-Advanced-Docking-System
  license: LGPL-2.0-or-later
  license_family: LGPL
  license_file: LICENSE
  summary: Advanced Docking System for Qt
  description: Advanced Docking System for Qt
  dev_url: https://github.com/githubuser0xFFFF/Qt-Advanced-Docking-System

extra:
  recipe-maintainers:
    - klauer
    - n-elie
